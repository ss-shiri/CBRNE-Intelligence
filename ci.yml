name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  ingest-tests:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/ingest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        working-directory: services/ingest
        run: ruff check .

      - name: Tests
        working-directory: services/ingest
        run: pytest tests/ -q


  schema-validation:

    runs-on: ubuntu-latest

    services:

      postgres:

        image: pgvector/pgvector:pg16

        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cbrne

        options: >-
          --health-cmd "pg_isready -U postgres -d cbrne"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

        ports:
          - 5432:5432


    steps:

      - uses: actions/checkout@v4


      - name: Apply schema

        env:
          PGPASSWORD: postgres

        run: |
          psql \
          -h localhost \
          -U postgres \
          -d cbrne \
          -v ON_ERROR_STOP=1 \
          -f db/schema.sql


      - name: Verify extensions

        env:
          PGPASSWORD: postgres

        run: |
          psql \
          -h localhost \
          -U postgres \
          -d cbrne \
          -c "SELECT extname FROM pg_extension;"


      - name: Verify core intelligence tables

        env:
          PGPASSWORD: postgres

        run: |
          psql \
          -h localhost \
          -U postgres \
          -d cbrne \
          -c "
          SELECT table_name
          FROM information_schema.tables
          WHERE table_name IN
          (
          'raw_documents',
          'articles',
          'article_versions',
          'entities',
          'assessments'
          );
          "
